services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: loadout
      POSTGRES_PASSWORD: loadout
      POSTGRES_DB: loadout
    ports:
      # Host 5432 is taken by a native postgres on this machine; 5433 avoids it.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadout"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
