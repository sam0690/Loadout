services:
  postgres:
    image: postgres:16
    environment:
      # From .env (gitignored). The :? form fails the run rather than starting a
      # database with a default password nobody chose.
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env, see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env, see .env.example}
    ports:
      # Host 5432 is taken by a native postgres on this machine; 5433 avoids it.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
