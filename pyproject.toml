[project]
name = "loadout"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "hypothesis>=6.122",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Alembic revisions are generated by autogenerate and then hand-annotated. Reformatting
# them to satisfy a linter makes them harder to diff against a fresh autogenerate run.
[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
files = ["schema.py", "migrations", "tests"]

# --strict is required on engine/ (CLAUDE.md). engine/ arrives at 0.4; the block is
# here so it starts biting the moment that package exists rather than being retrofitted.
[[tool.mypy.overrides]]
module = ["engine.*", "ingest.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
