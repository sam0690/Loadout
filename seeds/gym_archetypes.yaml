# Gym archetypes: one question instead of two hundred (PRD §7).
#
# You cannot ask a user to enumerate the equipment in their gym, so you ask which kind of
# room they are standing in and let them amend it. The preset covers perhaps 80% of what
# is actually there; training_contexts.equipment_added / equipment_removed absorb the rest.
#
# Slugs are the six named in PRD §7. Equipment is by slug and is validated on load, so a
# typo here fails the seed rather than silently producing a thinner gym.

- slug: bodyweight_only
  name: No equipment
  # A floor, and the furniture already in the room. D30: a chair and a table are modelled
  # as equipment because they cost nothing, exist in every home, and between them carry
  # real dips and a real inverted row -- which is the difference between a usable plan
  # and one with no pulling in it. Someone in a genuinely bare room removes them from
  # their context; that is what equipment_removed is for.
  #
  # Listed first because presets are ordered leanest-first (D27), and because this is the
  # launch cohort: PRD §1 calls the minimal-equipment case the sharpest differentiator.
  equipment: [chair, sturdy_table]

- slug: minimal_apartment
  name: Apartment, minimal kit
  # D12 names this archetype as the bound for "every pattern reaches a terminal". It is
  # the leanest context with purchased kit; bodyweight_only is leaner still.
  equipment: [resistance_bands, pull_up_bar, suspension_trainer, chair, sturdy_table]

- slug: hotel
  name: Hotel gym
  # Light fixed dumbbells, a bench, and usually one cable tower. Rarely a barbell.
  equipment: [dumbbells, adjustable_bench, cable_stack]

- slug: garage
  name: Garage gym
  equipment:
    [barbell, plates, dumbbells, kettlebell, adjustable_bench, pull_up_bar]

- slug: crossfit_box
  name: CrossFit box
  # Barbells and open floor. Machines are the thing a box deliberately does not have.
  equipment:
    [barbell, plates, dumbbells, kettlebell, pull_up_bar, suspension_trainer]

- slug: university_rec
  name: University rec centre
  # Well equipped but rarely has the specialty plate-loaded machines a chain buys.
  equipment:
    [barbell, plates, dumbbells, kettlebell, adjustable_bench, flat_bench, pull_up_bar,
     cable_stack, smith_machine, lat_pulldown, seated_row_machine, chest_press_machine,
     leg_press, leg_curl_machine, leg_extension_machine]

- slug: commercial_chain
  name: Commercial chain gym
  equipment:
    [barbell, plates, dumbbells, kettlebell, adjustable_bench, flat_bench, pull_up_bar,
     suspension_trainer, resistance_bands, cable_stack, smith_machine, lat_pulldown,
     seated_row_machine, chest_press_machine, pec_deck, leg_press, leg_curl_machine,
     leg_extension_machine, hack_squat]
