# Canonical equipment taxonomy. Brand names are aliases, never rows (PRD §7).
#
# load_increments (D17): the loads this item can express, sorted ascending.
#   null  -> derived. Expressible loads depend on something else (a barbell needs
#            bar weight plus whatever plates the context has), computed at 1.1.
#   []    -> nothing to load. Bodyweight, a bench, a pull-up bar.
#   list  -> an enumerated rack.
# Values are kilograms and describe a typical item; a user's actual rack is a
# training-context concern, not a catalog one.

- slug: bodyweight
  class: bodyweight
  is_fixed_path: false
  load_increments: []
  movement_patterns: [horizontal_press, vertical_press, squat, hinge, lunge,
                      knee_flexion, core_anti_extension, core_anti_rotation]

- slug: resistance_bands
  class: band
  is_fixed_path: false
  # Bands have discrete tensions but no load in kg, and their force curve is not
  # linear. Empty here means "no kg increments", NOT an answer to PRD §12's open
  # question about whether bands are loadable for e1RM purposes. Do not read it as one.
  load_increments: []
  movement_patterns: [horizontal_press, vertical_press, horizontal_pull, vertical_pull,
                      squat, hinge, lunge, elbow_flexion, elbow_extension,
                      shoulder_abduction, knee_flexion, core_anti_rotation]

- slug: dumbbells
  class: free_weight
  is_fixed_path: false
  # One canonical row, not adjustable-vs-fixed. An exercise requires "a dumbbell"; which
  # rack the user owns is a training-context property, and exercises.equipment is checked
  # as a subset, so two rows would make a fixed-dumbbell exercise unavailable to someone
  # holding adjustables. See D20.
  #
  # ASSUMPTION, not a fact about any user: a typical commercial rack. A training context
  # overrides it in training_context_loads (D21). Onboarding does not have to ask before
  # the first plan exists, and a user with a 5-20kg home set corrects it later.
  load_increments: [2.5, 5, 7.5, 10, 12.5, 15, 17.5, 20, 22.5, 25, 27.5, 30, 32.5,
                    35, 37.5, 40]
  movement_patterns: [horizontal_press, vertical_press, horizontal_pull, squat, hinge,
                      lunge, elbow_flexion, elbow_extension, shoulder_abduction]
  aliases:
    - {alias: "Bowflex SelectTech", source: brand}
    - {alias: "PowerBlock", source: brand}
    - {alias: "adjustable dumbbells", source: generic}
    - {alias: "fixed dumbbells", source: generic}
    - {alias: "dumbbell rack", source: generic}
    - {alias: "hex dumbbells", source: generic}
    - {alias: "dumbbell", source: ingest}

- slug: kettlebell
  class: free_weight
  is_fixed_path: false
  load_increments: [8, 12, 16, 20, 24, 28, 32, 40]
  movement_patterns: [vertical_press, hinge, squat, lunge, core_anti_rotation]
  aliases:
    - {alias: "kettle bell", source: generic}
    - {alias: "girya", source: region}

- slug: pull_up_bar
  class: bar
  is_fixed_path: false
  load_increments: []
  movement_patterns: [vertical_pull, core_anti_extension]
  aliases:
    - {alias: "chin-up bar", source: generic}
    - {alias: "doorway bar", source: generic}

- slug: flat_bench
  class: bench
  is_fixed_path: false
  load_increments: []
  movement_patterns: [horizontal_press, horizontal_pull]
  aliases:
    - {alias: "weight bench", source: generic}
    - {alias: "utility bench", source: brand}

- slug: adjustable_bench
  class: bench
  is_fixed_path: false
  load_increments: []
  movement_patterns: [horizontal_press, vertical_press, horizontal_pull, elbow_flexion]
  aliases:
    - {alias: "incline bench", source: generic}
    - {alias: "FID bench", source: brand}

- slug: barbell
  class: bar
  is_fixed_path: false
  # Derived: 20kg bar plus whatever plate pairs the training context has (D17).
  load_increments: null
  movement_patterns: [horizontal_press, vertical_press, horizontal_pull, squat, hinge,
                      lunge, elbow_flexion, elbow_extension]
  aliases:
    - {alias: "olympic bar", source: generic}
    - {alias: "straight bar", source: generic}

- slug: plates
  class: free_weight
  is_fixed_path: false
  # Individual plate weights. 1.1 composes these into a barbell's expressible loads;
  # a pair of the smallest is the practical increment.
  load_increments: [1.25, 2.5, 5, 10, 15, 20, 25]
  movement_patterns: []
  aliases:
    - {alias: "bumper plates", source: generic}
    - {alias: "iron plates", source: generic}

- slug: suspension_trainer
  class: bodyweight
  is_fixed_path: false
  load_increments: []
  movement_patterns: [horizontal_press, horizontal_pull, vertical_pull, squat, lunge,
                      knee_flexion, core_anti_extension]
  aliases:
    - {alias: "TRX", source: brand}
    - {alias: "gymnastic rings", source: generic}

# --- Commercial gym machines -------------------------------------------------
# Every machine carries at least two brand aliases; ingest resolves through them
# or raises rather than creating a near-duplicate canonical row (PRD §7).

- slug: cable_stack
  class: machine
  # Not fixed-path: a cable column is the one machine that leaves the path free,
  # which is why it substitutes so widely.
  is_fixed_path: false
  load_increments: [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 75, 80]
  movement_patterns: [horizontal_press, horizontal_pull, vertical_pull, elbow_flexion,
                      elbow_extension, shoulder_abduction, core_anti_rotation, hinge]
  aliases:
    - {alias: "Life Fitness Dual Adjustable Pulley", source: brand}
    - {alias: "Technogym Cable Station", source: brand}
    - {alias: "functional trainer", source: generic}
    - {alias: "cable crossover", source: generic}

